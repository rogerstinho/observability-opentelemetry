version: '3'
services:
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.98.0
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    volumes:
      - ./docker/collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml
    restart: always
    networks:
      - observability-network
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
      - "8889" # Prometheus exporter metrics
    depends_on:
      - loki
      - jaeger-all-in-one
      - zipkin-all-in-one
      - tempo

  tempo:
    container_name: tempo
    image: grafana/tempo:2.5.0
    command:
      - -config.file=/etc/tempo/tempo.yaml
      - -config.expand-env=true
    restart: always
    networks:
      - observability-network
    ports:
      - "4317"  # otlp grpc
      - "3200"  # tempo as grafana datasource
    volumes:
      - ./docker/tempo:/var/tempo
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yaml

  loki:
    container_name: loki
    image: grafana/loki:2.9.8
    command:
    - -config.file=/etc/loki/local-config.yaml
    - -config.expand-env=true
    restart: always
    ports:
      - "3100:3100"
    networks:
      - observability-network
    volumes:
      - ./docker/loki:/loki
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    volumes:
      - ./docker/prometheus:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.path=/prometheus
    restart: always
    networks:
      - observability-network
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  grafana:
    container_name: grafana
    image: grafana/grafana
    volumes:
      - ./docker/grafana:/var/lib/grafana
      - ./docker/grafana/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: always
    networks:
      - observability-network
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger-all-in-one
      - zipkin-all-in-one
      - tempo

  jaeger-all-in-one:
    container_name: jaeger
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: always
    ports:
      - "16686:16686"
      - "4317"
    networks:
      - observability-network

  zipkin-all-in-one:
    container_name: zipkin
    image: openzipkin/zipkin:latest
    restart: always
    ports:
      - "9411:9411"
    networks:
      - observability-network

networks:
  observability-network:
    driver: bridge
    external:
      name: observability-network