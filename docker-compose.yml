services:
  department-service:
    image: department
    container_name: department-service
    build:
      context: ./
      dockerfile: microservices/department/Dockerfile
    ports:
      - "8081:8080"
    networks:
      - service_network
    environment:
      - SPRING_PROFILES_ACTIVE=TEST
      - SERVER_PORT=8080

      - CLIENTS_SERVICES_EMPLOYEE_SERVICE_URL=http://employee-service:8080
      - CLIENTS_SERVICES_BANK_ACCOUNT_SERVICE_URL=http://bank-account-service:8080

      - OTEL_SDK_DISABLED=false
      - OTEL_SERVICE_NAME=department-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_INSTRUMENTATION_MICROMETER_ENABLED=true
    depends_on:
      - employee-service

  employee-service:
    image: employee
    container_name: employee-service
    build:
      context: ./
      dockerfile: microservices/employee/Dockerfile
    ports:
      - "8082:8080"
    networks:
      - service_network
    environment:
      - SPRING_PROFILES_ACTIVE=TEST
      - SERVER_PORT=8080

      - CLIENTS_SERVICES_BANK_ACCOUNT_SERVICE_URL=http://bank-account-service:8080

      - OTEL_SDK_DISABLED=false
      - OTEL_SERVICE_NAME=employee-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_INSTRUMENTATION_MICROMETER_ENABLED=true

  bank-account-service:
    image: bank-account
    container_name: bank-account-service
    build:
      context: ./
      dockerfile: microservices/bank-account/Dockerfile
    ports:
      - "8083:8080"
    networks:
      - service_network
    environment:
      - SPRING_PROFILES_ACTIVE=TEST
      - SERVER_PORT=8080

      - OTEL_SDK_DISABLED=false
      - OTEL_SERVICE_NAME=bank-account-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_INSTRUMENTATION_MICROMETER_ENABLED=true
    depends_on:
      - employee-service

networks:
  service_network:
    external:
      name: observability-network