receivers:
  otlp:
    protocols:
      grpc:
      http:
        # Required so browser-based apps (the Angular SPA on :4200) can POST
        # OTLP/HTTP. Without CORS the browser blocks the request (405 / no
        # Access-Control-Allow-Origin) and no data reaches the collector.
        cors:
          allowed_origins:
            - "http://localhost:4200"
            - "http://localhost:*"
            - "http://127.0.0.1:*"
          allowed_headers:
            - "*"
          max_age: 7200
#  httpcheck:
#    targets:
#      - endpoint: http://department-service:9000/actuator/health
#        method: GET
#      - endpoint: http://employee-service:9000/actuator/health
#        method: GET
#      - endpoint: http://bank-account-service:9000/actuator/health
#        method: GET
#      - endpoint: http://payroll-service:9000/actuator/health
#        method: GET
#    collection_interval: 60s

processors:
  # batch metrics before sending to reduce API usage
  batch:
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 10s

exporters:
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"

  prometheus:
    endpoint: "0.0.0.0:8889"
    enable_open_metrics: true

  otlp/jaeger:
    endpoint: "http://jaeger:4317"
    tls:
      insecure: true

  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans
    format: proto

  otlp/tempo:
    endpoint: "http://tempo:4317"
    tls:
      insecure: true

  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

  # Temporary: prints received telemetry to the collector log so you can confirm
  # the SPA data is arriving (`podman logs otel-collector`). Remove once verified.
  debug:
    verbosity: detailed

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheusremotewrite, debug ]
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/jaeger,zipkin,otlp/tempo, debug ]
    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ loki, debug ]